<div class="register-container">
  <div class="space-background"></div>
  <div class="stars"></div>

  <div class="register-card">
    <div class="register-header">
      <h2 class="register-title">Crear cuenta</h2>
    </div>

    <form #form="ngForm" (ngSubmit)="onSubmit(form)">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" class="form-input"
          [(ngModel)]="nuevoUsuario.username" required minlength="3" />
      </div>

      <div class="form-group">
        <label class="form-label" for="gmail">Correo</label>
        <input id="gmail" name="gmail" class="form-input"
          [(ngModel)]="nuevoUsuario.gmail" required email />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" class="form-input" type="password"
          [(ngModel)]="nuevoUsuario.password" required minlength="6" />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
        <input id="confirmarPassword" name="confirmarPassword" class="form-input" type="password"
          [(ngModel)]="confirmarPassword" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="birthday">Fecha de nacimiento</label>
        <input id="birthday" name="birthday" class="form-input" type="date"
          [(ngModel)]="birthdayStr" [max]="maxDate" required />
      </div>

      <button class="register-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Registrando...' : 'Registrarse' }}
      </button>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <div class="login-section">
      ¿Ya tienes cuenta?
      <button type="button" (click)="goToLogin()">Inicia sesión</button>
    </div>
  </div>
</div>
